name: Build jar

on:
  workflow_dispatch:
  push:
    branches: [ feat/anchoraura, main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: liquidbounce-jar
          path: build/libs/*.jar
          if-no-files-found: error
